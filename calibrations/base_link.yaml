# Base Link Coordinate Frame Configuration
# Derived from output-dobots/scenes/most-scene.json (2d_corner_ba hand-eye bundle adjustment).
#
# Mathematical mapping:
#   R_custom = diag([-1, 1, -1]) @ R_base_tag0.T
#   origin_tag0_m = -R_custom @ t_base_tag0
#   p_base_link = R_custom.T @ p_tracker_map - R_custom.T @ origin_tag0_m

base_link:
  source: output-dobots/scenes/most-scene.json
  # Origin [X, Y, Z] of base_link in Tag 0 frame (meters)
  origin_tag0_m:
    - 0.1044455266260424
    - -0.011077681567024818
    - -0.12796954554005657

  # 3x3 rotation matrix (columns are base_link X, Y, Z axes in Tag 0 frame)
  rotation_matrix:
    - [-0.06280002760556486,  0.01078382052582616,  0.9979678680937609]
    - [-0.03895471854331519, -0.9992061231251587,  0.008345861992641543]
    - [ 0.9972656047593094,  -0.03835143705333465,  0.06317025280931451]

  auto_calculate_from_plane_a: false
