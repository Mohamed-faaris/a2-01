# Centralized AprilTag Calibration Marker Configuration
# Dobot Vision - 28 Tags Setup
# Unit: meters (m)

family: "tag36h11"
default_size_m: 0.0885

# Marker roles and link assignments
groups:
  tcp_markers:
    link: "tcp"
    role: "calibrate"
    description: "End-effector mounted calibration markers"
    tags:
      - ids: [6, 7, 8, 9, 10, 11, 12, 13]
        size_m: 0.0575
        size_mm: 57.5
        description: "Compact tool tags 06-13"
      - ids: [40]
        size_m: 0.0660
        size_mm: 66.0
        description: "Tool head / gripper tag 40"
      - ids: [20, 21]
        size_m: 0.0410
        size_mm: 41.0
        description: "Mini cube tool tags 20, 21"
      - ids: [62, 63, 64, 65, 66, 67]
        size_m: 0.0700
        size_mm: 70.0
        description: "Large 70mm tool plate tags 62-67"

  base_markers:
    link: "base_link"
    role: "static"
    description: "Stationary environment & robot base reference markers"
    tags:
      - ids: [0, 1]
        size_m: 0.1240
        size_mm: 124.0
        description: "Large base reference markers"
      - ids: [4, 5]
        size_m: 0.0885
        size_mm: 88.5
        description: "Medium base fiducial markers"
      - ids: [41]
        size_m: 0.0660
        size_mm: 66.0
        description: "Base fixture tag 41"
      - ids: [54, 55]
        size_m: 0.0700
        size_mm: 70.0
        description: "Base boundary static tags 54, 55"

  workpiece_box1:
    link: "box"
    role: "box"
    description: "Workpiece Box 1 (42..45)"
    grid:
      pitch: 0.060
      face_ids: [42, 43, 44, 45]
    tags:
      - ids: [42, 43, 44, 45]
        size_m: 0.0660
        size_mm: 66.0
        description: "Workpiece 1 face tags"

  workpiece_box2:
    link: "box2"
    role: "box"
    description: "Workpiece Box 2 (50..53)"
    grid:
      pitch: 0.060
      face_ids: [50, 51, 52, 53]
    tags:
      - ids: [50, 51, 52, 53]
        size_m: 0.0700
        size_mm: 70.0
        description: "Workpiece 2 face tags"

